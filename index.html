*{box-sizing:border-box}body{margin:0;background:#10151b;color:#e5ede8;font:15px system-ui;display:flex;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}header,footer{padding:14px 16px;background:#19232a}header{display:flex;align-items:center;justify-content:space-between;gap:12px}strong{letter-spacing:.15em;color:#afffc4}small{color:#a1b4b1}main{flex:1;min-height:0;position:relative}canvas{width:100%;height:100%;display:block;touch-action:none;image-rendering:pixelated}#status{position:absolute;top:12px;left:12px;background:#10151bcc;padding:8px;border-radius:8px;pointer-events:none}footer{display:grid;gap:10px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select{font:inherit;color:inherit;background:#293b40;border:1px solid #47605e;border-radius:9px;min-height:44px;padding:8px 12px}button:active{background:#4a7761}select{max-width:62%;flex:1}input{flex:1;min-width:90px;accent-color:#afffc4}#walk{position:absolute;bottom:12px;left:12px;text-align:center;touch-action:none}#walk button{min-width:48px;background:#19232add}#enter,#fire{position:absolute;bottom:16px;right:12px;background:#265b4b}#crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:32px;color:#ffdf82;pointer-events:none;text-shadow:0 1px 4px #000}[hidden]{display:none!important}</style><body><header><strong>SPLATTASTIC</strong><small>THEME PARK LAB · 03.4</small></header><main><canvas id="view"></canvas><div id="status">Loading engine…</div><div id="crosshair" hidden>+</div><div id="walk" hidden><button data-dir="forward">▲</button><div><button data-dir="left">◀</button><button data-dir="back">▼</button><button data-dir="right">▶</button></div></div><button id="enter" hidden></button><button id="fire" hidden>Fire</button></main><footer><div class="row"><select id="scene" aria-label="Scene"></select><button id="play">Pause</button><button id="reset">Reset</button></div><div class="row"><button id="mode">Walk</button><button id="park">Park</button><label for="quality">Detail</label><input id="quality" type="range" min="1" max="3" value="2"></div><small>Drag to look · Walk to a gate · Ride or explore</small></footer><script src="engine.js?v=034"></script><script src="park.js?v=034"></script><script>
'use strict';const $=id=>document.getElementById(id),c=$('view'),ctx=c.getContext('2d'),status=$('status');let world,scene,yaw=.45,pitch=.25,dist=12,target=[0,1,0],playing=true,t=0,last=0,material=0,extra=0,frame=0,points=new Map(),moved=false,downTime=0,cam,mode='orbit',walker=[0,1.4,8],walkYaw=Math.PI,walkPitch=0,held=new Set(),rideLook=0,ridePitch=0,nearGate=null,parkReturn=null;
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],sub=(a,b)=>a.map((v,i)=>v-b[i]),norm=a=>{let n=Math.hypot(...a)||1;return a.map(v=>v/n)},cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
function custom(){const {makeBuilder,makeSculpt,KIT}=INK,B=makeBuilder(7,[0x10151b,0x30394c,0x66738a,0xa8b9ca,0xe6f2e9,0x217d65,0x72e6a1,0xffb769]),S=KIT.sculpt(makeSculpt(B));S.ground({r:[1,1,2]},{rad:3,res:.24});S.box([0,.5,0],[.9,.5,.9],{r:[1,2,3,4]},{res:.15});for(let i=0;i<=extra;i++){let a=i*2.4;S.ball([i?Math.cos(a)*1.5:0,1.55+(i%2)*.4,i?Math.sin(a)*1.5:0],i?.33:.65,{r:material?[1,2,3,4]:[1,5,6,7]},{res:.12});}S.bake();return B.finish({cam:{target:[0,1,0],dist:9,pitch:.3,yaw:.45},detail:14});}
function load(id){mode=id==='park'?'walk':(id==='dark'?'ride':'orbit');held.clear();rideLook=0;ridePitch=0;if(id==='park'){walker=parkReturn?.pos.slice()||[0,1.4,8];walkYaw=parkReturn?.yaw??Math.PI;walkPitch=0;}status.textContent='Building scene…';requestAnimationFrame(()=>{try{scene=id;const s=[...PARK_SCENES,...INK.SCENES].find(s=>s.id===id);if(id!=='sculpt'&&!s)throw new Error('Scene unavailable: '+id+'. Refresh to load the latest version.');world=id==='sculpt'?custom():s.build(s.seed);const v=world.cam||{};yaw=v.yaw??.45;pitch=v.pitch??.25;dist=v.dist??12;target=v.target??[0,1,0];t=0;world.anim?.update(0,0);syncMode();status.textContent='Ready';}catch(e){status.textContent='Scene error: '+e.message;}})}
function syncMode(){const walk=mode==='walk',ride=mode==='ride';$('walk').hidden=!walk;$('crosshair').hidden=!(ride&&scene==='dark');$('fire').hidden=!(ride&&scene==='dark');$('enter').hidden=true;$('mode').hidden=!(scene==='park'||world?.rideCamera);$('mode').textContent=mode==='orbit'?(scene==='park'?'Walk':'Ride POV'):'Orbit';}
function walkStep(dt){if(mode!=='walk'||!world?.gates)return;const x=(held.has('right')?1:0)-(held.has('left')?1:0),z=(held.has('forward')?1:0)-(held.has('back')?1:0),n=Math.hypot(x,z)||1;walker[0]=Math.max(-10,Math.min(10,walker[0]+(Math.sin(walkYaw)*z+-Math.cos(walkYaw)*x)*dt*3/n));walker[2]=Math.max(-9,Math.min(9,walker[2]+(Math.cos(walkYaw)*z+Math.sin(walkYaw)*x)*dt*3/n));nearGate=world.gates.find(g=>Math.hypot(walker[0]-g.x,walker[2]-(g.z+2))<2.6);$('enter').hidden=!nearGate;if(nearGate)$('enter').textContent='Enter '+nearGate.name;}
function camera(){let eye,aim;if(mode==='walk'){eye=walker.slice();aim=[eye[0]+Math.sin(walkYaw)*Math.cos(walkPitch),eye[1]+Math.sin(walkPitch),eye[2]+Math.cos(walkYaw)*Math.cos(walkPitch)];}else if(mode==='ride'&&world.rideCamera){const v=world.rideCamera();eye=v.eye;const d=norm(sub(v.target,eye)),a=Math.atan2(d[0],d[2])+rideLook,b=Math.max(-1.2,Math.min(1.2,Math.asin(d[1])+ridePitch));aim=[eye[0]+Math.sin(a)*Math.cos(b),eye[1]+Math.sin(b),eye[2]+Math.cos(a)*Math.cos(b)];}else{eye=[target[0]+dist*Math.cos(pitch)*Math.sin(yaw),target[1]+dist*Math.sin(pitch),target[2]+dist*Math.cos(pitch)*Math.cos(yaw) ];aim=target;}const f=norm(sub(aim,eye)),r=norm(cross(f,[0,1,0])),u=cross(r,f);return {eye,f,r,u,scale:Math.min(c.width,c.height)*(mode==='orbit'?1.05:.82)};}
function draw(){let q=+$('quality').value,w=Math.max(1,Math.round(c.clientWidth*[0,.48,.7,1][q])),h=Math.max(1,Math.round(c.clientHeight*[0,.48,.7,1][q]));if(c.width!==w||c.height!==h){c.width=w;c.height=h;}ctx.fillStyle='#10151b';ctx.fillRect(0,0,w,h);if(!world)return;cam=camera();let {eye,f,r,u,scale}=cam,d=world.data,rows=[],step=Math.max(1,Math.ceil(world.count/[1,12000,26000,55000][q]));for(let i=0;i<world.count;i+=step){let j=i*16;if(d[j+3]<=0)continue;let v=[d[j]-eye[0],d[j+1]-eye[1],d[j+2]-eye[2]],z=dot(v,f);if(z<.1)continue;let x=w/2+dot(v,r)*scale/z,y=h/2-dot(v,u)*scale/z;let size=Math.max(1,Math.min(22,Math.sqrt(Math.max(0,d[j+4],d[j+8],d[j+10]))*scale/z*2.3*Math.sqrt(step)));if(x<-size||y<-size||x>w+size||y>h+size)continue;rows.push([z,x,y,size,d[j+7]>>>0]);}rows.sort((a,b)=>b[0]-a[0]);for(const [,x,y,s,rgb] of rows){ctx.fillStyle='#'+(((rgb&255)<<16)|(rgb&65280)|((rgb>>>16)&255)).toString(16).padStart(6,'0');ctx.fillRect(Math.round(x-s/2),Math.round(y-s/2),Math.ceil(s),Math.ceil(s));}if(++frame%15===0)status.textContent=(scene==='dark'?'Score '+world.score()+' / 800':mode==='walk'?(nearGate?'At '+nearGate.name:'Explore the park'):world.count.toLocaleString()+' splats')+' · '+(playing?'LIVE':'PAUSED');}
function loop(now){let dt=Math.min(.05,(now-last)/1000||0);last=now;try{walkStep(dt);if(playing&&world){t+=dt;world.anim?.update(dt,t);}draw();}catch(e){status.textContent=e.message;world=null;}requestAnimationFrame(loop);}
c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);if(!points.size){moved=false;downTime=performance.now();}points.set(e.pointerId,[e.clientX,e.clientY]);});c.addEventListener('pointermove',e=>{if(!points.has(e.pointerId))return;let prev=points.get(e.pointerId),dx=e.clientX-prev[0],dy=e.clientY-prev[1];if(Math.abs(dx)+Math.abs(dy)>2)moved=true;if(points.size===2){let other=[...points.entries()].find(([id])=>id!==e.pointerId)[1],a=Math.hypot(prev[0]-other[0],prev[1]-other[1]),b=Math.hypot(e.clientX-other[0],e.clientY-other[1]);if(b>1)dist=Math.max(2,Math.min(60,dist*a/b));moved=true;}else if(mode==='walk'){walkYaw-=dx*.009;walkPitch=Math.max(-1.1,Math.min(1.1,walkPitch+dy*.009));}else if(mode==='ride'){rideLook-=dx*.009;ridePitch=Math.max(-1,Math.min(1,ridePitch+dy*.009));}else{yaw-=dx*.009;pitch=Math.max(-1.25,Math.min(1.25,pitch+dy*.009));}points.set(e.pointerId,[e.clientX,e.clientY]);});c.addEventListener('pointerup',e=>{points.delete(e.pointerId);if(!moved&&performance.now()-downTime<350&&cam&&world?.anim?.poke){let b=c.getBoundingClientRect(),x=((e.clientX-b.left)/b.width*c.width-c.width/2)/cam.scale,y=(c.height/2-(e.clientY-b.top)/b.height*c.height)/cam.scale;world.anim.poke(cam.eye,norm(cam.f.map((v,i)=>v+x*cam.r[i]+y*cam.u[i])));}});c.addEventListener('pointercancel',e=>points.delete(e.pointerId));c.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(2,Math.min(60,dist*Math.exp(e.deltaY*.001)));},{passive:false});$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pause':'Play';};$('reset').onclick=()=>{extra=0;load(scene||'park');};$('mode').onclick=()=>{mode=mode==='orbit'?(scene==='park'?'walk':'ride'):'orbit';held.clear();syncMode();};$('park').onclick=()=>{$('scene').value='park';load('park');};$('enter').onclick=()=>{if(!nearGate)return;parkReturn={pos:walker.slice(),yaw:walkYaw};$('scene').value=nearGate.id;load(nearGate.id);};$('fire').onclick=()=>{if(cam&&world?.anim?.poke)world.anim.poke(cam.eye,cam.f);};for(const b of $('walk').querySelectorAll('button')){const dir=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);held.add(dir);});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>held.delete(dir));}const keys={w:'forward',ArrowUp:'forward',s:'back',ArrowDown:'back',a:'left',ArrowLeft:'left',d:'right',ArrowRight:'right'};addEventListener('keydown',e=>{if(mode==='walk'&&keys[e.key]){e.preventDefault();held.add(keys[e.key]);}});addEventListener('keyup',e=>held.delete(keys[e.key]));addEventListener('blur',()=>held.clear());$('scene').onchange=e=>{if(e.target.value==='dog'){location.href='dog.html';return;}load(e.target.value);};if(window.INK){for(const s of [...PARK_SCENES,{id:'sculpt',name:'Sculpt lab'},...INK.SCENES]){$('scene').add(new Option(s.name||s.id,s.id));}$('scene').add(new Option('🐕 Sleeping Dog (import)','dog'));const requested=new URLSearchParams(location.search).get('scene');if(requested==='dog')location.replace('dog.html');const initial=[...PARK_SCENES,...INK.SCENES].some(s=>s.id===requested)?requested:'park';$('scene').value=initial;load(initial);requestAnimationFrame(loop);}else status.textContent='Engine missing. Run npm install && npm run build.';
</script></body></html>
