<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Splattastic</title><style>
*{box-sizing:border-box}body{margin:0;background:#10151b;color:#e5ede8;font:15px system-ui;display:flex;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}header,footer{padding:14px 16px;background:#19232a}header{display:flex;align-items:center;justify-content:space-between;gap:12px}strong{letter-spacing:.15em;color:#afffc4}small{color:#a1b4b1}main{flex:1;min-height:0;position:relative}canvas{width:100%;height:100%;display:block;touch-action:none;image-rendering:pixelated}#status{position:absolute;top:12px;left:12px;background:#10151bcc;padding:8px;border-radius:8px;pointer-events:none}footer{display:grid;gap:10px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select{font:inherit;color:inherit;background:#293b40;border:1px solid #47605e;border-radius:9px;min-height:44px;padding:8px 12px}button:active{background:#4a7761}select{max-width:62%;flex:1}input{flex:1;min-width:90px;accent-color:#afffc4}</style><body><header><strong>SPLATTASTIC</strong><small>TOUCH LAB · 01</small></header><main><canvas id="view"></canvas><div id="status">Loading engine…</div></main><footer><div class="row"><select id="scene" aria-label="Scene"></select><button id="play">Pause</button><button id="reset">Reset</button></div><div class="row"><button id="sculpt">Add gem</button><button id="material">Material</button><label for="quality">Detail</label><input id="quality" type="range" min="1" max="3" value="2"></div><small>Drag to orbit · Pinch to zoom · Tap to interact</small></footer><script src="engine.js"></script><script>
'use strict';const $=id=>document.getElementById(id),c=$('view'),ctx=c.getContext('2d'),status=$('status');let world,scene,yaw=.45,pitch=.25,dist=12,target=[0,1,0],playing=true,t=0,last=0,material=0,extra=0,frame=0,points=new Map(),moved=false,downTime=0,cam;
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],sub=(a,b)=>a.map((v,i)=>v-b[i]),norm=a=>{let n=Math.hypot(...a)||1;return a.map(v=>v/n)},cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
function custom(){const {makeBuilder,makeSculpt,KIT}=INK,B=makeBuilder(7,[0x10151b,0x30394c,0x66738a,0xa8b9ca,0xe6f2e9,0x217d65,0x72e6a1,0xffb769]),S=KIT.sculpt(makeSculpt(B));S.ground({r:[1,1,2]},{rad:3,res:.24});S.box([0,.5,0],[.9,.5,.9],{r:[1,2,3,4]},{res:.15});for(let i=0;i<=extra;i++){let a=i*2.4;S.ball([i?Math.cos(a)*1.5:0,1.55+(i%2)*.4,i?Math.sin(a)*1.5:0],i?.33:.65,{r:material?[1,2,3,4]:[1,5,6,7]},{res:.12});}S.bake();return B.finish({cam:{target:[0,1,0],dist:9,pitch:.3,yaw:.45},detail:14});}
function load(id){status.textContent='Building scene…';requestAnimationFrame(()=>{try{scene=id;const s=INK.SCENES.find(s=>s.id===id);world=id==='sculpt'?custom():s.build(s.seed);const v=world.cam||{};yaw=v.yaw??.45;pitch=v.pitch??.25;dist=v.dist??12;target=v.target??[0,1,0];t=0;world.anim?.update(0,0);status.textContent='Ready';}catch(e){status.textContent='Scene error: '+e.message;}})}
function camera(){let eye=[target[0]+dist*Math.cos(pitch)*Math.sin(yaw),target[1]+dist*Math.sin(pitch),target[2]+dist*Math.cos(pitch)*Math.cos(yaw)],f=norm(sub(target,eye)),r=norm(cross(f,[0,1,0])),u=cross(r,f);return {eye,f,r,u,scale:Math.min(c.width,c.height)*1.05};}
function draw(){let q=+$('quality').value,w=Math.max(1,Math.round(c.clientWidth*[0,.48,.7,1][q])),h=Math.max(1,Math.round(c.clientHeight*[0,.48,.7,1][q]));if(c.width!==w||c.height!==h){c.width=w;c.height=h;}ctx.fillStyle='#10151b';ctx.fillRect(0,0,w,h);if(!world)return;cam=camera();let {eye,f,r,u,scale}=cam,d=world.data,rows=[],step=Math.max(1,Math.ceil(world.count/[1,12000,26000,55000][q]));for(let i=0;i<world.count;i+=step){let j=i*16;if(d[j+3]<=0)continue;let v=[d[j]-eye[0],d[j+1]-eye[1],d[j+2]-eye[2]],z=dot(v,f);if(z<.1)continue;let x=w/2+dot(v,r)*scale/z,y=h/2-dot(v,u)*scale/z;let size=Math.max(1,Math.min(22,Math.sqrt(Math.max(0,d[j+4],d[j+8],d[j+10]))*scale/z*2.3*Math.sqrt(step)));if(x<-size||y<-size||x>w+size||y>h+size)continue;rows.push([z,x,y,size,d[j+7]>>>0]);}rows.sort((a,b)=>b[0]-a[0]);for(const [,x,y,s,rgb] of rows){ctx.fillStyle='#'+(rgb&0xffffff).toString(16).padStart(6,'0');ctx.fillRect(Math.round(x-s/2),Math.round(y-s/2),Math.ceil(s),Math.ceil(s));}if(++frame%15===0)status.textContent=world.count.toLocaleString()+' splats · '+(playing?'LIVE':'PAUSED');}
function loop(now){let dt=Math.min(.05,(now-last)/1000||0);last=now;try{if(playing&&world){t+=dt;world.anim?.update(dt,t);}draw();}catch(e){status.textContent=e.message;world=null;}requestAnimationFrame(loop);}
c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);if(!points.size){moved=false;downTime=performance.now();}points.set(e.pointerId,[e.clientX,e.clientY]);});c.addEventListener('pointermove',e=>{if(!points.has(e.pointerId))return;let prev=points.get(e.pointerId),dx=e.clientX-prev[0],dy=e.clientY-prev[1];if(Math.abs(dx)+Math.abs(dy)>2)moved=true;if(points.size===2){let other=[...points.entries()].find(([id])=>id!==e.pointerId)[1],a=Math.hypot(prev[0]-other[0],prev[1]-other[1]),b=Math.hypot(e.clientX-other[0],e.clientY-other[1]);if(b>1)dist=Math.max(2,Math.min(60,dist*a/b));moved=true;}else{yaw-=dx*.009;pitch=Math.max(-1.25,Math.min(1.25,pitch+dy*.009));}points.set(e.pointerId,[e.clientX,e.clientY]);});c.addEventListener('pointerup',e=>{points.delete(e.pointerId);if(!moved&&performance.now()-downTime<350&&cam&&world?.anim?.poke){let b=c.getBoundingClientRect(),x=((e.clientX-b.left)/b.width*c.width-c.width/2)/cam.scale,y=(c.height/2-(e.clientY-b.top)/b.height*c.height)/cam.scale;world.anim.poke(cam.eye,norm(cam.f.map((v,i)=>v+x*cam.r[i]+y*cam.u[i])));}});c.addEventListener('pointercancel',e=>points.delete(e.pointerId));c.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(2,Math.min(60,dist*Math.exp(e.deltaY*.001)));},{passive:false});$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pause':'Play';};$('reset').onclick=()=>{extra=0;load(scene);};$('sculpt').onclick=()=>{extra=Math.min(12,extra+1);$('scene').value='sculpt';load('sculpt');};$('material').onclick=()=>{material=1-material;$('scene').value='sculpt';load('sculpt');};$('scene').onchange=e=>load(e.target.value);if(window.INK){for(const s of [{id:'sculpt',name:'Sculpt lab'},...INK.SCENES]){$('scene').add(new Option(s.name||s.id,s.id));}load('sculpt');requestAnimationFrame(loop);}else status.textContent='Engine missing. Run npm install && npm run build.';
</script></body></html>
